<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Input Example</title>
</head>
<body>

  <label for="search">Search:</label>
  <input type="text" id="search" placeholder="Type something and press Enter..." />

  <script>
    const input = document.querySelector("#search");

    input.addEventListener("keyup", function (e) {
      if (e.key === "Enter") {
        console.log("Searching for:", input.value);
      }
    });
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Number Input Example</title>
</head>
<body>

  <label for="phone">Phone Number:</label>
  <input type="text" id="phone" placeholder="Sirf numbers likhein..." inputmode="numeric" />

  <script>
    const phoneInput = document.querySelector("#phone");

    phoneInput.addEventListener("keydown", function (e) {
      // Allow backspace, delete, arrows, etc.
      if (["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"].includes(e.key)) {
        return;
      }
      // Block if not a number
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
