<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Account Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .form-container {
      background: #ffffff;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #444;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .checkbox-group label {
      margin: 0;
      font-weight: normal;
    }

    button {
      width: 100%;
      padding: 11px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #statusMessage {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>User Login</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Apna naam likhein" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Kam se kam 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" name="role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Note (Optional)</label>
        <textarea id="notes" name="notes" placeholder="Kuch extra likhna ho toh..."></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
      </div>

      <button type="submit">Login</button>
      <p id="statusMessage"></p>
    </form>
  </div>

  <script>
    const form = document.querySelector("#loginForm");
    const statusMessage = document.querySelector("#statusMessage");

    form.addEventListener("submit", async function (e) {
      e.preventDefault(); // stop page reload

      const formData = {
        fullName: document.querySelector("#fullName").value.trim(),
        email: document.querySelector("#email").value.trim(),
        password: document.querySelector("#password").value,
        role: document.querySelector("#role").value,
        notes: document.querySelector("#notes").value.trim(),
        rememberMe: document.querySelector("#remember").checked
      };

      console.log("Form submitted!");
      console.log("User Data:", formData);

      statusMessage.style.color = "#007bff";
      statusMessage.textContent = "Submitting data...";

      // Example fetch() call (apni real API URL se replace karein)
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        const result = await response.json();
        console.log("Server Response:", result);

        statusMessage.style.color = "green";
        statusMessage.textContent = "Form successfully submitted!";
        form.reset();
      } catch (error) {
        console.error("Fetch error:", error);
        statusMessage.style.color = "red";
        statusMessage.textContent = "Submit karte waqt error aaya.";
      }
    });
  </script>

</body>
</html>
